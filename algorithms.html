<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithms List</title>
  <style>
    :root {
      --primary: #1976d2;
      --primary-hover: #1565c0;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #e2e8f0;
      --badge-bg: #eef2f6;
      --badge-color: #334155;
      --act-badge-bg: #e0f2fe;
      --act-badge-color: #0369a1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
    }
    .subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .total-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-box {
      flex: 1 1 240px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      pointer-events: none;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .filter-group label {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    select:focus {
      border-color: var(--primary);
    }

    #file-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #file-list li {
      border-top: 1px solid var(--border);
      transition: background 0.15s;
    }
    #file-list li:first-child {
      border-top: none;
    }
    #file-list li:hover {
      background: #f8fafc;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      text-decoration: none;
      color: var(--text);
      border-radius: 6px;
      gap: 12px;
    }
    .file-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
      min-width: 0;
    }
    .file-icon {
      color: #64748b;
      flex-shrink: 0;
    }
    .file-name {
      font-weight: 500;
      color: #1e293b;
      word-break: break-all;
    }
    .file-item:hover .file-name {
      color: var(--primary);
      text-decoration: underline;
    }
    .badges {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 6px;
      font-weight: 500;
    }
    .badge-algo {
      background: var(--badge-bg);
      color: var(--badge-color);
    }
    .badge-act {
      background: var(--act-badge-bg);
      color: var(--act-badge-color);
    }

    .empty-state {
      padding: 36px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .pagination-buttons {
      display: flex;
      gap: 8px;
    }
    button {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      transition: all 0.15s;
    }
    button:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #page-info {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container { padding: 18px; }
      .pagination {
        flex-direction: column;
        align-items: stretch;
      }
      .pagination-buttons {
        justify-content: space-between;
      }
      #page-info { order: -1; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Algorithms List</h1>
        <p class="subtitle">Algorithms from the <code>algorithms/</code> folder</p>
      </div>
      <span class="total-badge" id="total-badge">278 algorithms</span>
    </header>

    <div class="controls">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-input" placeholder="Search algorithm name, ID or actions..." autocomplete="off">
      </div>

      <div class="filter-group">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select">
          <option value="id-asc">Algo ID (1 &rarr; 278)</option>
          <option value="id-desc">Algo ID (278 &rarr; 1)</option>
          <option value="act-asc">Actions (Low &rarr; High)</option>
          <option value="act-desc">Actions (High &rarr; Low)</option>
          <option value="name-asc">Name (A &rarr; Z)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="page-size">Per page:</label>
        <select id="page-size">
          <option value="15">15</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="all">All (278)</option>
        </select>
      </div>
    </div>

    <ul id="file-list"></ul>

    <nav class="pagination" aria-label="File list pagination">
      <div class="pagination-buttons">
        <button id="first" type="button">&laquo; First</button>
        <button id="previous" type="button">&larr; Previous</button>
      </div>
      <span id="page-info" aria-live="polite"></span>
      <div class="pagination-buttons">
        <button id="next" type="button">Next &rarr;</button>
        <button id="last" type="button">Last &raquo;</button>
      </div>
    </nav>
  </main>

    let filteredFiles = [...files];
    let pageSize = 25;
    let currentPage = 1;

    const list = document.getElementById("file-list");
    const pageInfo = document.getElementById("page-info");
    const previousButton = document.getElementById("previous");
    const nextButton = document.getElementById("next");
    const firstButton = document.getElementById("first");
    const lastButton = document.getElementById("last");
    const searchInput = document.getElementById("search-input");
    const sortSelect = document.getElementById("sort-select");
    const pageSizeSelect = document.getElementById("page-size");
    const totalBadge = document.getElementById("total-badge");

    function applyFilterAndSort() {
      const query = searchInput.value.trim().toLowerCase();
      const sortBy = sortSelect.value;

      filteredFiles = files.filter(f => {
        if (!query) return true;
        return (
          f.name.toLowerCase().includes(query) ||
          (f.id !== null && String(f.id).includes(query)) ||
          (f.act !== null && String(f.act).includes(query))
        );
      });

      filteredFiles.sort((a, b) => {
        switch (sortBy) {
          case "id-asc":
            return (a.id ?? 0) - (b.id ?? 0);
          case "id-desc":
            return (b.id ?? 0) - (a.id ?? 0);
          case "act-asc":
            return (a.act ?? 0) - (b.act ?? 0);
          case "act-desc":
            return (b.act ?? 0) - (a.act ?? 0);
          case "name-asc":
          default:
            return a.name.localeCompare(b.name, undefined, { numeric: true });
        }
      });

      currentPage = 1;
      renderPage();
    }

    function renderPage() {
      const actualPageSize = pageSize === "all" ? filteredFiles.length : Number(pageSize);
      const totalPages = Math.max(1, Math.ceil(filteredFiles.length / actualPageSize));
      currentPage = Math.min(Math.max(currentPage, 1), totalPages);

      const start = (currentPage - 1) * actualPageSize;
      const pageFiles = pageSize === "all" ? filteredFiles : filteredFiles.slice(start, start + actualPageSize);

      list.replaceChildren();

      if (filteredFiles.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "No algorithms matched your search.";
        list.appendChild(empty);
      } else {
        pageFiles.forEach(file => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "file-item";
          link.href = baseUrl + file.url + "&";
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const mainSpan = document.createElement("span");
          mainSpan.className = "file-main";

          const iconSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          iconSvg.setAttribute("class", "file-icon");
          iconSvg.setAttribute("width", "16");
          iconSvg.setAttribute("height", "16");
          iconSvg.setAttribute("viewBox", "0 0 24 24");
          iconSvg.setAttribute("fill", "none");
          iconSvg.setAttribute("stroke", "currentColor");
          iconSvg.setAttribute("stroke-width", "2");
          iconSvg.setAttribute("stroke-linecap", "round");
          iconSvg.setAttribute("stroke-linejoin", "round");
          iconSvg.innerHTML = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline>';

          const nameSpan = document.createElement("span");
          nameSpan.className = "file-name";
          nameSpan.textContent = file.name;

          mainSpan.appendChild(iconSvg);
          mainSpan.appendChild(nameSpan);

          const badgesSpan = document.createElement("span");
          badgesSpan.className = "badges";

          if (file.id !== null) {
            const algoBadge = document.createElement("span");
            algoBadge.className = "badge badge-algo";
            algoBadge.textContent = `#${file.id}`;
            badgesSpan.appendChild(algoBadge);
          }

          if (file.act !== null) {
            const actBadge = document.createElement("span");
            actBadge.className = "badge badge-act";
            actBadge.textContent = `${file.act} actions`;
            badgesSpan.appendChild(actBadge);
          }

          link.appendChild(mainSpan);
          link.appendChild(badgesSpan);
          item.appendChild(link);
          list.appendChild(item);
        });
      }

      if (filteredFiles.length === files.length) {
        pageInfo.textContent = `Page ${currentPage} of ${totalPages} · ${files.length} algorithms`;
      } else {
        pageInfo.textContent = `Page ${currentPage} of ${totalPages} · ${filteredFiles.length} of ${files.length} algorithms`;
      }

      totalBadge.textContent = `${files.length} algorithms`;

      firstButton.disabled = currentPage === 1;
      previousButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages || filteredFiles.length === 0;
      lastButton.disabled = currentPage === totalPages || filteredFiles.length === 0;
    }

    searchInput.addEventListener("input", applyFilterAndSort);
    sortSelect.addEventListener("change", applyFilterAndSort);
    pageSizeSelect.addEventListener("change", (e) => {
      pageSize = e.target.value === "all" ? "all" : Number(e.target.value);
      currentPage = 1;
      renderPage();
    });

    firstButton.addEventListener("click", () => {
      currentPage = 1;
      renderPage();
    });

    lastButton.addEventListener("click", () => {
      const actualPageSize = pageSize === "all" ? filteredFiles.length : Number(pageSize);
      currentPage = Math.max(1, Math.ceil(filteredFiles.length / actualPageSize));
      renderPage();
    });

    previousButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    });

    nextButton.addEventListener("click", () => {
      const actualPageSize = pageSize === "all" ? filteredFiles.length : Number(pageSize);
      const totalPages = Math.max(1, Math.ceil(filteredFiles.length / actualPageSize));
      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    });

    renderPage();
  </script>
